name: Build Android Loudbox APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Testing APK & Signed Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Ensure Upload Signing Keystore & Export PEM Certificate
        run: |
          if [ ! -f android/app/upload-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "loudbox@123" \
              -keypass "loudbox@123" \
              -dname "CN=Loudbox, OU=Android, O=Loudbox, L=Bengaluru, ST=Karnataka, C=IN"
          fi
          # Export public certificate for Google Play Console App Signing / Key Reset
          keytool -export -rfc \
            -keystore android/app/upload-keystore.jks \
            -alias upload \
            -file android/app/upload_certificate.pem \
            -storepass "loudbox@123"

      - name: Build Android Debug APK (For Immediate Physical Device Testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Signed Android Play Store App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Verify & Sign AAB with jarsigner
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore android/app/upload-keystore.jks \
            -storepass "loudbox@123" \
            -keypass "loudbox@123" \
            android/app/build/outputs/bundle/release/app-release.aab upload

      - name: Upload Testing APK Artifact (Install directly on phone)
        uses: actions/upload-artifact@v4
        with:
          name: Loudbox-Installable-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play Signed Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loudbox-GooglePlay-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Keystore Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loudbox-Upload-Keystore
          path: android/app/upload-keystore.jks

      - name: Upload Play Console PEM Certificate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loudbox-PlayConsole-PEM-Certificate
          path: android/app/upload_certificate.pem
