name: Build Android Soundbox APK & Play Store Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Testing APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK (For Immediate Physical Device Testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Play Store App Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Testing APK Artifact (Install directly on phone)
        uses: actions/upload-artifact@v4
        with:
          name: Soundbox-Installable-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Soundbox-GooglePlay-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
