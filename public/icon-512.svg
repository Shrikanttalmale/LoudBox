<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#purpleGrad)" />
  <!-- Speaker Body -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Speaker box base -->
    <rect x="60" y="80" width="220" height="350" rx="40" fill="#ffffff" opacity="0.15" />
    <rect x="70" y="90" width="200" height="330" rx="30" fill="#18181b" />
    
    <!-- Top Display Screen -->
    <rect x="90" y="115" width="160" height="60" rx="12" fill="#27272a" />
    <circle cx="115" cy="145" r="8" fill="#22c55e" />
    <rect x="135" y="137" width="95" height="16" rx="4" fill="#a1a1aa" opacity="0.6" />

    <!-- Speaker Grille -->
    <circle cx="170" cy="280" r="85" fill="#27272a" stroke="#7c3aed" stroke-width="6" />
    <circle cx="170" cy="280" r="55" fill="#3f3f46" />
    <circle cx="170" cy="280" r="28" fill="#a855f7" />
    <circle cx="170" cy="280" r="12" fill="#ffffff" />

    <!-- Sound waves -->
    <path d="M 320 200 A 110 110 0 0 1 320 360" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <path d="M 370 160 A 170 170 0 0 1 370 400" fill="none" stroke="#c084fc" stroke-width="16" stroke-linecap="round" />
    <path d="M 420 120 A 230 230 0 0 1 420 440" fill="none" stroke="#e9d5ff" stroke-width="14" stroke-linecap="round" />

    <!-- Indian Rupee Badge -->
    <circle cx="95" cy="385" r="26" fill="#10b981" />
    <text x="95" y="394" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">₹</text>
  </g>
</svg>
